<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>성구암송 발표 · LA 중앙교회</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon-32.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="lacc-parser.js"></script>
  <style>
    :root { --bg1: #04213f; --bg2: #00427a; --ink: #ffffff; --ink2: #cfe4f6; --gold: #7fd3f7; --accent: #ffb703; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg1); color: var(--ink); font-family: 'Noto Sans KR', system-ui, sans-serif; overflow: hidden; }
    #deck { height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth; scrollbar-width: none; }
    #deck::-webkit-scrollbar { display: none; }
    .slide { position: relative; height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; padding: 3vh 4.5vw 6vh;
      background: radial-gradient(ellipse at 80% 10%, rgba(34,178,233,.14), transparent 55%), linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%); }
    .slide + .slide { border-top: 1px solid rgba(255,255,255,.06); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
    .brand { display: flex; align-items: center; gap: 1.2vw; font-size: clamp(14px, 2.4vh, 30px); font-weight: 700; color: var(--ink2); }
    .brand img { width: 5.2vh; height: 5.2vh; border-radius: 1vh; background: #fff; padding: .35vh; }
    .lang { display: inline-flex; align-items: center; gap: .9vw; padding: .8vh 1.6vw; border-radius: 99px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); font-size: clamp(14px, 2.6vh, 32px); font-weight: 900; }
    .lang svg { width: 4.4vh; height: 2.95vh; border-radius: .3vh; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
    .body { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; min-height: 0; }
    .inner { display: flex; flex-direction: column; align-items: center; max-width: 100%; }
    .label { font-size: clamp(14px, 2.6vh, 34px); font-weight: 900; color: var(--gold); letter-spacing: .02em; }
    .slide[data-w="last"] .label, .slide[data-w="next"] .label { color: #bcd6dd; }
    .theme { margin-left: .8vw; display: inline-block; padding: .2vh 1.1vw; border-radius: 99px; background: rgba(34,178,233,.18); color: var(--gold); font-weight: 700; font-size: .85em; vertical-align: .05em; }
    .verse { margin: 1.6vh 0 0; max-width: 92vw; font-family: 'Noto Serif KR', Georgia, serif; font-weight: 700; line-height: 1.55; word-break: keep-all; text-wrap: balance; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
    .ref { margin-top: 2.2vh; font-size: clamp(18px, 4.2vh, 56px); font-weight: 900; color: var(--gold); }
    .ref::before { content: "— "; }
    .empty { font-size: 4vh; color: var(--ink2); }
    /* 페이지 번호 · 안내 */
    #pager { position: fixed; right: 2.2vw; bottom: 2.4vh; font-size: clamp(12px, 2vh, 22px); color: rgba(255,255,255,.55); font-weight: 700; z-index: 5; }
    #hint { position: fixed; left: 50%; bottom: 2.4vh; transform: translateX(-50%); font-size: clamp(12px, 2vh, 22px); color: rgba(255,255,255,.7); transition: opacity .6s; z-index: 5; }
    /* 조작 버튼 (움직임이 없으면 숨김) */
    #ctrl { position: fixed; bottom: 2vh; left: 1.6vw; display: flex; gap: 8px; z-index: 10; transition: opacity .4s; }
    #ctrl.hide { opacity: 0; pointer-events: none; }
    #ctrl button { min-height: 42px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.45); color: #fff; font: 700 15px 'Noto Sans KR', sans-serif; cursor: pointer; backdrop-filter: blur(6px); }
    #ctrl button[aria-pressed="true"] { background: var(--gold); color: #2b1d00; border-color: var(--gold); }
    #ctrl .sep { width: 8px; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 3vh; color: var(--ink2); }
    @media (max-width: 700px) { #ctrl { flex-wrap: wrap; max-width: 80vw; } #ctrl button { min-height: 38px; padding: 0 10px; font-size: 13px; } }
  </style>
</head>
<body>
  <div id="loading">…</div>
  <main id="deck" aria-live="polite"></main>
  <div id="ctrl">
    <button type="button" data-jump="ko">🇰🇷 한국어</button>
    <button type="button" data-jump="es">🇲🇽 Español</button>
    <button type="button" data-jump="en">🇺🇸 English</button>
    <span class="sep"></span>
    <button type="button" id="fsBtn"></button>
    <button type="button" id="closeBtn"></button>
  </div>
  <div id="pager"></div>
  <div id="hint"></div>

<script>
(function () {
  'use strict';
  var CFG = window.BULLETIN_CONFIG || {};
  var params = new URLSearchParams(location.search);
  var week = params.get('week') || '';
  var which = ['last', 'this', 'next'].indexOf(params.get('which')) !== -1 ? params.get('which') : 'this';
  var ORDER = ['ko', 'es', 'en'];   // 한국어 → 스페인어 → 영어
  var UI = (params.get('lang') || 'ko');
  var FLAGS = {
    ko: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><g transform="translate(15 10) rotate(33.7)"><path d="M-5 0a5 5 0 0 1 10 0z" fill="#cd2e3a"/><path d="M-5 0a5 5 0 0 0 10 0z" fill="#0047a0"/><circle cx="-2.5" r="2.5" fill="#cd2e3a"/><circle cx="2.5" r="2.5" fill="#0047a0"/></g></svg>',
    es: '<svg viewBox="0 0 30 20"><rect width="10" height="20" fill="#006847"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce1126"/><circle cx="15" cy="10" r="2.6" fill="#8c6a2f"/></svg>',
    en: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#b22234"/><g fill="#fff"><rect y="1.54" width="30" height="1.54"/><rect y="4.62" width="30" height="1.54"/><rect y="7.69" width="30" height="1.54"/><rect y="10.77" width="30" height="1.54"/><rect y="13.85" width="30" height="1.54"/><rect y="16.92" width="30" height="1.54"/></g><rect width="12" height="10.77" fill="#3c3b6e"/></svg>',
  };
  var T = {
    ko: { name: 'LA 중앙교회', lang: '한국어', label: { last: '지난주 암송 말씀', this: '이번 주 암송 말씀', next: '다음 주 암송 말씀' } },
    es: { name: 'LA Central Church', lang: 'Español', label: { last: 'Versículo de la semana pasada', this: 'Versículo de esta semana', next: 'Versículo de la próxima semana' } },
    en: { name: 'LA Central Church', lang: 'English', label: { last: 'Last Week’s Memory Verse', this: 'This Week’s Memory Verse', next: 'Next Week’s Memory Verse' } },
  };
  var CTRL = {
    ko: { last: '지난주', this: '이번 주', next: '다음 주', fs: '⛶ 전체 화면', exitFs: '⛶ 전체 화면 끝', close: '✕ 닫기', hint: '↓ 다음 언어 · 키보드 ↓ / Space / 리모컨으로 넘기기', none: '이 주에는 암송 말씀이 없습니다.' },
    en: { last: 'Last week', this: 'This week', next: 'Next week', fs: '⛶ Full screen', exitFs: '⛶ Exit full screen', close: '✕ Close', hint: '↓ Next language · Arrow ↓ / Space / clicker', none: 'No memory verse for this week.' },
    es: { last: 'Semana pasada', this: 'Esta semana', next: 'Próxima semana', fs: '⛶ Pantalla completa', exitFs: '⛶ Salir', close: '✕ Cerrar', hint: '↓ Siguiente idioma · Flecha ↓ / Espacio / control', none: 'No hay versículo esta semana.' },
  }[UI] || null;
  var C = CTRL || { last: '지난주', this: '이번 주', next: '다음 주', fs: '⛶ 전체 화면', exitFs: '⛶ 전체 화면 끝', close: '✕ 닫기', hint: '↓', none: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var view = null;

  function field(o, w) {
    if (!o) return { text: '', ref: '', theme: '' };
    if (w === 'last') return { text: o.memoryLastText, ref: o.memoryLastRef, theme: o.memoryVerseTheme };
    if (w === 'next') return { text: o.memoryNextText, ref: o.memoryNextRef, theme: o.memoryVerseTheme };
    return { text: o.memoryVerseText, ref: o.memoryVerseRef, theme: o.memoryVerseTheme };
  }

  // 언어마다 지난주 → 이번 주 → 다음 주 (한국어 3장 → 스페인어 3장 → 영어 3장)
  function build() {
    var slides = [];
    ORDER.forEach(function (l) { ['last', 'this', 'next'].forEach(function (w) { slides.push(slideHtml(l, w)); }); });
    $('deck').innerHTML = slides.join('') || '<section class="slide"><div class="body"><p class="empty">' + esc(C.none) + '</p></div></section>';
    fitAll(); $('deck').scrollTop = 0; updatePager();
  }
  function slideHtml(l, w) {
      var f = field(view && view[l], w);
      if (!f.text) return '';
      var which = w;
      return '<section class="slide" lang="' + l + '" data-w="' + w + '">' +

        '<div class="body"><div class="inner"><div class="label">' + esc(T[l].label[which]) + (f.theme ? ' <span class="theme">' + esc(f.theme) + '</span>' : '') + '</div>' +
        '<p class="verse">' + esc(f.text) + '</p>' + (f.ref ? '<div class="ref">' + esc(f.ref) + '</div>' : '') + '</div></div></section>';
  }

  // 글씨를 화면에 꽉 차게 (넘치면 줄임)
  function fitAll() {
    document.querySelectorAll('.slide').forEach(function (sl) {
      var v = sl.querySelector('.verse'), body = sl.querySelector('.body'), inner = sl.querySelector('.inner');
      if (!v || !inner) return;
      var size = Math.min(window.innerHeight * 0.13, window.innerWidth * 0.08);
      v.style.fontSize = size + 'px';
      var room = body.clientHeight * 0.98, guard = 0;
      while (inner.offsetHeight > room && size > 12 && guard++ < 80) { size *= 0.95; v.style.fontSize = size + 'px'; }
    });
  }

  function slides() { return Array.prototype.slice.call(document.querySelectorAll('.slide')); }
  function current() { var h = window.innerHeight; return Math.round($('deck').scrollTop / h); }
  function go(i) { var s = slides(); if (!s.length) return; i = Math.max(0, Math.min(s.length - 1, i)); s[i].scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  function updatePager() {
    var s = slides(), n = s.length, i = current();
    $('pager').textContent = n > 1 ? (i + 1) + ' / ' + n : '';
    var l = s[i] && s[i].lang;
    document.querySelectorAll('#ctrl [data-jump]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-jump') === l)); });
  }
  $('deck').addEventListener('scroll', function () { clearTimeout(updatePager.t); updatePager.t = setTimeout(updatePager, 80); });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (['ArrowDown', 'ArrowRight', 'PageDown', ' ', 'Enter'].indexOf(k) !== -1) { e.preventDefault(); go(current() + 1); }
    else if (['ArrowUp', 'ArrowLeft', 'PageUp', 'Backspace'].indexOf(k) !== -1) { e.preventDefault(); go(current() - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(99); }
    else if (k === 'f' || k === 'F') toggleFs();
    poke();
  });

  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
    else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function () {}).call(document.documentElement);
  }
  document.addEventListener('fullscreenchange', function () { $('fsBtn').textContent = document.fullscreenElement ? C.exitFs : C.fs; setTimeout(function () { fitAll(); go(current()); }, 250); });
  $('fsBtn').addEventListener('click', toggleFs);
  $('closeBtn').addEventListener('click', function () { window.close(); });
  // 언어 바로가기: 그 언어의 「지난주」 화면으로
  document.querySelectorAll('#ctrl [data-jump]').forEach(function (b) {
    b.addEventListener('click', function () {
      var s = slides(), l = b.getAttribute('data-jump');
      for (var i = 0; i < s.length; i++) if (s[i].lang === l) { go(i); break; }
    });
  });
  window.addEventListener('resize', function () { clearTimeout(fitAll.t); fitAll.t = setTimeout(function () { fitAll(); go(current()); }, 150); });

  // 마우스를 움직이면 버튼이 보이고, 가만히 있으면 숨김 (발표 화면을 깨끗하게)
  function poke() { $('ctrl').classList.remove('hide'); document.body.style.cursor = ''; clearTimeout(poke.t); poke.t = setTimeout(function () { $('ctrl').classList.add('hide'); document.body.style.cursor = 'none'; }, 2500); }
  ['mousemove', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, poke, { passive: true }); });

  // 글자
  $('fsBtn').textContent = C.fs; $('closeBtn').textContent = C.close; $('hint').textContent = C.hint;
  setTimeout(function () { $('hint').style.opacity = 0; }, 6000);
  poke();

  // 소식지 데이터 불러오기 (모바일 소식지와 같은 주소)
  var url = CFG.API_URL ? CFG.API_URL + (CFG.API_URL.indexOf('?') === -1 ? '?' : '&') + (week ? 'week=' + encodeURIComponent(week) + '&' : '') + 't=' + Date.now() : 'sample-data.json';
  fetch(url, { redirect: 'follow' }).then(function (r) { return r.json(); }).then(function (d) {
    var b = d.bulletin || (d.bulletins && d.bulletins[week || d.weeks[0]]);
    view = window.LACCParser ? window.LACCParser.fromBulletin(b) : null;
    $('loading').remove(); build();
    if (document.fonts && document.fonts.load) {
      // 슬라이드에 쓰인 글꼴을 미리 불러온 뒤 다시 맞춤
      Promise.all(['700 40px "Noto Serif KR"', '900 40px "Noto Sans KR"'].map(function (f) { return document.fonts.load(f, 'Aa가'); })).then(refit, refit);
    }
  }).catch(function () { $('loading').textContent = C.none; });
  // 웹 글꼴이 늦게 도착하면 글자 크기가 바뀌므로 글꼴이 다 오면 다시 맞춤
  function refit() { fitAll(); updatePager(); }
  if (document.fonts) {
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', refit);
    document.fonts.ready.then(refit);
  }
  [600, 1500, 3000].forEach(function (ms) { setTimeout(refit, ms); });
})();
</script>
</body>
</html>
